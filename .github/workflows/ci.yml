name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 检查与测试（Python ${{ matrix.python }}）
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装对拍依赖（pnpm，版本取自 packageManager）
        working-directory: tests/parity
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: 安装 Python 依赖
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: ruff / mypy --strict / 引擎（覆盖率 100% + 对拍）/ 后端（覆盖率 ≥ 80%）
        run: bash scripts/check.sh

  frontend:
    name: 前端（类型检查 / lint / 单元测试 / 构建）
    runs-on: ubuntu-24.04
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: API 类型与 docs/api/openapi.json 一致
        run: pnpm run check:api
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: 单元测试（覆盖率 ≥ 80%）
        run: pnpm run test
      - run: pnpm run build

  mysql:
    name: 迁移与模型一致性（MySQL 8）
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          # 仅用于 CI 中的一次性测试容器，不是任何环境的真实密码
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: zongce_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - name: 安装依赖（含 MySQL 驱动）
        run: uv sync --frozen --python 3.12 --group mysql
      - name: 在 MySQL 8 上升级 / 比对 / 降级
        env:
          ZONGCE_TEST_MYSQL_URL: mysql+pymysql://root:ci-only@127.0.0.1:3306/zongce_test
        run: uv run --frozen pytest backend/tests/test_migrations.py -v
