[project]
name = "zongce-platform"
version = "0.0.0"
description = "综测智能核算平台（uv 工作区根，仅用于统一开发依赖与工具配置）"
requires-python = ">=3.11"
dependencies = ["zongce-engine"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
zongce-engine = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
# 本项目注释与文档使用中文，全角标点不是“易混淆字符”
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["engine/src", "engine/tests", "tests"]
mypy_path = ["tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["engine/tests", "tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["parity: 与 legacy 页面对拍（需要 Node.js 与 tests/parity 下的 pnpm 依赖）"]

[tool.coverage.run]
branch = true
source = ["zongce_engine"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-jsonschema>=4.26.0.20261006",
]
